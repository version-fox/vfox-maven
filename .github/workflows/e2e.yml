name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request replaces the run of the push before it. Every
  # commit on main gets a group of its own instead, so a newer run never cancels
  # an older one there.
  group: e2e-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-linux:
    if: github.repository == 'version-fox/vfox-maven'
    name: Linux container (${{ matrix.runs-on }})
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      # The check is built for the runner's architecture and runs in the e2e image,
      # which holds vfox and the Java runtimes. The checkout is mounted read-only.
      - name: Build the check
        run: go test -c -o "$RUNNER_TEMP/e2e.test" .
        working-directory: tests/e2e
        env:
          CGO_ENABLED: '0'
      - name: Build the e2e image
        run: docker build --tag vfox-maven-e2e tests/e2e
      - name: Run the check in the container
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --volume "$RUNNER_TEMP/e2e.test:/usr/local/bin/e2e.test:ro" \
            --env VFOX_MAVEN_PLUGIN_DIR=/src \
            vfox-maven-e2e \
            e2e.test -test.run '^TestE2E$' -test.v -test.timeout 40m

  e2e-windows:
    if: github.repository == 'version-fox/vfox-maven'
    name: Windows (${{ matrix.runs-on }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: windows-latest
            jdk-arch: x64
            asset: vfox_1.1.0_windows_x86_64.zip
            sha256: 1bbec8fffddbb62de0d93030c3f6203c69680662bc65257ca4a5e611cb607d0a
          # windows-11-arm is GitHub's Windows arm64 runner.
          - runs-on: windows-11-arm
            jdk-arch: aarch64
            asset: vfox_1.1.0_windows_aarch64.zip
            sha256: 67bf5c8b3bde5c1b3fc06dcaa460db9bb1dc9fc587b467d1dc96205377767465
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    env:
      VFOX_VERSION: 1.1.0
      VFOX_ASSET: ${{ matrix.asset }}
      VFOX_SHA256: ${{ matrix.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      # Maven 1.1 needs a JDK 8, and Temurin has no JDK 8 for Windows on arm64, so the
      # x64 one runs there under emulation. The other releases run on the JDK installed
      # last, which is the default and matches the runner's architecture. setup-java
      # exports the x64 JDK 8 as JAVA_HOME_8_X64.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          architecture: x64
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.jdk-arch }}
      - name: Install vfox
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP $env:VFOX_ASSET
          Invoke-WebRequest -Uri "https://github.com/version-fox/vfox/releases/download/v$env:VFOX_VERSION/$env:VFOX_ASSET" -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLower()
          if ($actual -ne $env:VFOX_SHA256) { throw "vfox checksum is $actual, want $env:VFOX_SHA256" }
          $dir = Join-Path $env:RUNNER_TEMP "vfox"
          Expand-Archive -Path $archive -DestinationPath $dir -Force
          $binary = Get-ChildItem -Path $dir -Recurse -Filter vfox.exe | Select-Object -First 1
          $binary.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Run the check
        shell: pwsh
        working-directory: tests/e2e
        run: |
          $env:VFOX_MAVEN_JAVA8_HOME = $env:JAVA_HOME_8_X64
          go test -count=1 -v -run '^TestE2E$' -timeout 40m .
